<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body,html,#map{margin:0;height:100%;background:#121212;} 
        .legend { line-height: 18px; color: white; }
        .custom-uav-icon { background: transparent; border: none; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map', {fadeAnimation: false, zoomAnimation: false, markerZoomAnimation: false, doubleClickZoom: false}).setView([16.0748, 108.1498], 17);
        
        // L.tileLayer('https://www.google.cn/maps/vt?lyrs=s,h&x={x}&y={y}&z={z}', {
        //     maxZoom: 20,
        //     attribution: '© Google Earth'
        // }).addTo(map);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxNativeZoom: 19,
            maxZoom: 24,
            attribution: '© Esri & Earthstar Geographics'
        }).addTo(map);

        window.isDragging = false;
        var dragTimer;
        
        map.on('dragstart', function() { 
            window.isDragging = true; 
            clearTimeout(dragTimer); 
        });
        
        map.on('dragend', function() {
            dragTimer = setTimeout(function() { window.isDragging = false; }, 4000);
        });

        // =========================================================================
        // --- CLICK TO GO ---
        var popup = L.popup();
        map.on('contextmenu', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;
            var content = `<div style="text-align: center;">
                            <b style="color:#2980b9;">TARGET COORDINATES</b><br>
                            <span style="font-size:11px; color:#555;">${lat.toFixed(6)}, ${lng.toFixed(6)}</span><br><br>
                            <button onclick="window.location.href='flyhere://${lat}/${lng}'" 
                                    style="background-color:#e74c3c; color:white; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer;">
                                FLY HERE
                            </button>
                           </div>`;
            popup.setLatLng(e.latlng).setContent(content).openOn(map);
        });

        // =========================================================================
        // --- WAYPOINT MANAGEMENT ---
        var wpPath = L.polyline([], {color:'#3498db', weight:4, opacity:0.8, dashArray: '8, 8'}).addTo(map);
        var markers = [];
        
        window.addMarker = function(lat, lon, count){
            var m = L.circleMarker([lat,lon], {radius:8, color:'white', fillColor:'#e74c3c', fillOpacity:1, weight:2}).addTo(map);
            m.bindTooltip("WP " + count, {permanent:true, direction:'top'});
            markers.push(m);
            wpPath.addLatLng([lat, lon]);
        };
        
        window.clearMap = function(){
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            wpPath.setLatLngs([]);

            zicZacMarkers.forEach(m => map.removeLayer(m));
            zicZacMarkers = [];
            zicZacPolygon.setLatLngs([]);
            zicZacCoords = [];
        };

        // =========================================================================
        // --- GEOFENCE ---
        window.isDrawingFence = false;
        var fencePolygon = L.polygon([], {color: '#e74c3c', weight: 3, fillColor: '#c0392b', fillOpacity: 0.3, dashArray: '5, 5'}).addTo(map);
        var fenceMarkers = [];

        window.toggleFenceMode = function(state) {
            window.isDrawingFence = state;
            if(state) {
                window.isDrawingPoly = false; 
                map.getContainer().style.cursor = 'crosshair';
            } else map.getContainer().style.cursor = '';
        };

        window.addFencePoint = function(lat, lon, count) {
            var m = L.circleMarker([lat, lon], {radius: 5, color: 'white', fillColor: 'red', fillOpacity: 1}).addTo(map);
            fenceMarkers.push(m);
            fencePolygon.addLatLng([lat, lon]);
        };

        window.clearFenceMap = function() {
            fenceMarkers.forEach(m => map.removeLayer(m));
            fenceMarkers = [];
            fencePolygon.setLatLngs([]);
        };

        // =========================================================================
        // --- POLYGON ZIG-ZAG SCANNING ---
        window.isDrawingPoly = false;
        var zicZacPolygon = L.polygon([], {color: '#9b59b6', weight: 3, fillColor: '#8e44ad', fillOpacity: 0.4}).addTo(map);
        var zicZacMarkers = [];
        var zicZacCoords = []; 

        window.togglePolyMode = function(state) {
            window.isDrawingPoly = state;
            if(state) {
                window.isDrawingFence = false;
                zicZacPolygon.setLatLngs([]); 
                zicZacMarkers.forEach(m => map.removeLayer(m));
                zicZacMarkers = [];
                zicZacCoords = [];
                map.getContainer().style.cursor = 'crosshair';
            } else {
                map.getContainer().style.cursor = '';
            }
        };

        // Double Click to finalize polygon and send coordinates to main app 
        map.on('dblclick', function(e) {
            if (window.isDrawingPoly && zicZacCoords.length >= 3) {
                var coordsString = zicZacCoords.join('_');
                window.location.href = "polygon://route/" + coordsString;
                
                window.togglePolyMode(false); 
                map.getContainer().style.cursor = '';
            }
        });


        // --- OVERWRITE THE CLICK EVENT ---
        map.off('click');
        map.on('click', function(e){
            if (!window.isDragging) {
                if (window.isDrawingFence) {
                    window.location.href = "fence://" + e.latlng.lat + "/" + e.latlng.lng;
                } 
                else if (window.isDrawingPoly) {
                    var lat = e.latlng.lat;
                    var lng = e.latlng.lng;
                    var m = L.circleMarker([lat, lng], {radius: 4, color: 'white', fillColor: '#8e44ad', fillOpacity: 1}).addTo(map);
                    zicZacMarkers.push(m);
                    zicZacPolygon.addLatLng([lat, lng]);
                    zicZacCoords.push(lat + "," + lng); 
                } 
                else {
                    window.location.href = "wp://" + e.latlng.lat + "/" + e.latlng.lng;
                }
            }
        });

        // =================================================================
        // --- REMOTE FUNCTIONS FROM MAIN ---
        function getDest(lat, lon, brng, dist) {
            var R = 6371e3;
            var rLat1 = lat * Math.PI/180, rLon1 = lon * Math.PI/180, rBrng = brng * Math.PI/180;
            var rLat2 = Math.asin(Math.sin(rLat1)*Math.cos(dist/R) + Math.cos(rLat1)*Math.sin(dist/R)*Math.cos(rBrng));
            var rLon2 = rLon1 + Math.atan2(Math.sin(rBrng)*Math.sin(dist/R)*Math.cos(rLat1), Math.cos(dist/R)-Math.sin(rLat1)*Math.sin(rLat2));
            return [rLat2 * 180/Math.PI, rLon2 * 180/Math.PI];
        }

        var headingLine = L.polyline([], {color: 'black', weight: 3}).addTo(map);
        var courseLine = L.polyline([], {color: '#f39c12', weight: 2, dashArray: '5, 5'}).addTo(map);

        var quadXSvg = `
            <div id="uav-wrapper-mission" style="width: 46px; height: 46px; transform-origin: 23px 23px; transform: rotate(0deg); transition: transform 0.1s linear;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="46" height="46" style="filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.6)); display: block;">
                    <line x1="20" y1="20" x2="80" y2="80" stroke="#7f8c8d" stroke-width="8" stroke-linecap="round"/>
                    <line x1="20" y1="80" x2="80" y2="20" stroke="#7f8c8d" stroke-width="8" stroke-linecap="round"/>
                    <circle cx="50" cy="50" r="14" fill="#2c3e50" stroke="#ecf0f1" stroke-width="2"/>
                    <polygon points="50,28 40,50 60,50" fill="#e74c3c"/>
                    <circle cx="20" cy="20" r="15" fill="rgba(231, 76, 60, 0.4)" stroke="#e74c3c" stroke-width="3"/>
                    <circle cx="80" cy="20" r="15" fill="rgba(231, 76, 60, 0.4)" stroke="#e74c3c" stroke-width="3"/>
                    <circle cx="20" cy="80" r="15" fill="rgba(52, 152, 219, 0.4)" stroke="#3498db" stroke-width="3"/>
                    <circle cx="80" cy="80" r="15" fill="rgba(52, 152, 219, 0.4)" stroke="#3498db" stroke-width="3"/>
                </svg>
            </div>
        `;
        
        var droneIcon = L.divIcon({ className: 'custom-uav-icon', html: quadXSvg, iconSize: [46, 46], iconAnchor: [23, 23] });
        var droneMarker = L.marker([16.0748, 108.1498], {icon: droneIcon, zIndexOffset: 1000}).addTo(map);

        var legend = L.control({position: 'bottomleft'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend');
            div.style.backgroundColor = 'rgba(0, 0, 0, 0.75)';
            div.style.padding = '8px 12px';
            div.style.borderRadius = '6px';
            div.style.fontFamily = 'Arial';
            div.style.fontSize = '12px';
            div.style.border = '1px solid #333';
            
            div.innerHTML = '<b style="color:#ecf0f1; font-size:13px;">FLIGHT PATH LEGEND</b><hr style="border-color:#555; margin:5px 0;">' +
                '<div style="margin-top:5px; display:flex; align-items:center;">' +
                    '<span style="display:inline-block; width:25px; height:3px; background-color:black; margin-right:8px;"></span>' + 
                    '<span style="color:#bdc3c7;"><b>Heading</b> (Nose Direction)</span>' +
                '</div>' +
                '<div style="margin-top:8px; display:flex; align-items:center;">' +
                    '<span style="display:inline-block; width:25px; height:0px; border-top:3px dashed #f39c12; margin-right:8px;"></span>' + 
                    '<span style="color:#bdc3c7;"><b>Course</b> (GPS Trajectory)</span>' +
                '</div>' +
                '<div style="margin-top:8px; display:flex; align-items:center;">' +
                    '<span style="display:inline-block; width:25px; height:0px; border-top:3px dashed #3498db; margin-right:8px;"></span>' + 
                    '<span style="color:#bdc3c7;"><b>Mission</b> (Waypoints)</span>' +
                '</div>';
            return div;
        };
        legend.addTo(map);

        window.updateDronePos = function(lat, lon, heading, course) {
            heading = heading || 0;
            course = course || 0;
            
            var p = [lat, lon];
            droneMarker.setLatLng(p);
            
            var wrapper = document.getElementById('uav-wrapper-mission');
            if(wrapper) wrapper.style.transform = 'rotate(' + heading + 'deg)';
            
            headingLine.setLatLngs([p, getDest(lat, lon, heading, 5000)]);
            courseLine.setLatLngs([p, getDest(lat, lon, course, 5000)]);
            
            if (!window.isDragging) {
                var center = map.getCenter();
                if (map.distance(center, p) > 25) {
                    map.setView(p, map.getZoom(), {animate: false});
                }
            }
        };
    </script>
</body>
</html>
